apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen2-7b-npu
  namespace: default
  labels:
    model.aibrix.ai/name: qwen2-7b
    model.aibrix.ai/port: "8000"
spec:
  replicas: 1
  selector:
    matchLabels:
      model.aibrix.ai/name: qwen2-7b
  template:
    metadata:
      labels:
        model.aibrix.ai/name: qwen2-7b
    spec:
      nodeName: m1  # Force deployment to single node (change to n1 if needed)
      containers:
      - name: vllm-npu
        image: docker.io/library/vllm-ascend-custom:latest 
        imagePullPolicy: Never
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --host
        - "0.0.0.0"
        - --model
        - "Qwen/Qwen2-7B-Instruct"
        - --trust-remote-code
        resources:
          limits:
            huawei.com/Ascend910: "1"
