apiVersion: v1
kind: Service
metadata:
  name: qwen257
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: qwen257
  ports:
    - protocol: TCP
      port: 8008
      targetPort: 8008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen257
  namespace: default
  labels:
    app: qwen257
    component: vllm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen257
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen257
        model.aibrix.ai/name: qwen257
        model.aibrix.ai/port: "8008"
        model.aibrix.ai/engine: vllm
      annotations:
        model.aibrix.ai/config: |
          {
            "lockedRoutingStrategy": "slo-least-load"
          }
    spec:
      schedulerName: default-scheduler
      containers:
        - name: vllm-ascend
          image: quay.io/ascend/vllm-ascend:v0.11.0rc1
          command: ["/bin/bash","-c"]
          args:
            - |
              vllm serve Qwen/Qwen2.5-7B-Instruct \
              --host 0.0.0.0 \
              --port 8008 \
              --tensor-parallel-size 2 \
              --served-model-name qwen257 \
              --trust-remote-code \
              --max-model-len 32768
          resources:
            limits:
              huawei.com/Ascend910: "2"
            requests:
              huawei.com/Ascend910: "2"
          volumeMounts:
            - name: ascend-drivers
              mountPath: /usr/local/Ascend/driver
            - name: localtime
              mountPath: /etc/localtime
            - name: data
              mountPath: /data
            - name: home
              mountPath: /home
            - name: reset-config
              mountPath: /user/restore/reset/config
            - name: ranktable
              mountPath: /user/mindx-dl/ranktable
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: home
          hostPath:
            path: /home
        - name: data
          hostPath:
            path: /data
        - name: ascend-drivers
          hostPath:
            path: /usr/local/Ascend/driver
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: reset-config
          hostPath:
            path: /user/restore/reset/default.reset-config-qwen257
        - name: ranktable
          hostPath:
            path: /user/mindx-dl/ranktable/default.qwen257
        - name: dshm
          emptyDir:
            medium: Memory
---
apiVersion: autoscaling.aibrix.ai/v1alpha1
kind: PodAutoscaler
metadata:
  name: qwen257-autoscaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qwen257
  minReplicas: 1
  maxReplicas: 4
  scalingStrategy: KPA
  metricsSources:
    - endpoint: aibrix-gpu-optimizer.aibrix-system.svc.cluster.local:8080
      metricSourceType: domain
      path: /metrics/default/qwen257
      protocolType: http
      targetMetric: vllm:deployment_replicas
      targetValue: "100"
