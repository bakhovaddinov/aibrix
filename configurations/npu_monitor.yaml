apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: npu-exporter-monitor
  namespace: monitoring
  labels:
    release: prometheus 
spec:
  selector:
    matchLabels:
      app: app.kubernetes.io/managed-by=npu-operator,app=npu-exporter,controller-revision-hash=6479954dd7,helm.sh/chart=npu-operator-1.2.0,pod-template-generation=1 # <--- UPDATE THIS to match your pod's label
  namespaceSelector:
    any: true
  podMetricsEndpoints:
  - targetPort: 8082
    path: /metrics
    interval: 15s