apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen257-router
  namespace: aibrix-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aibrix-eg
      namespace: aibrix-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - name: model
              value: qwen257
              type: Exact
        - path:
            type: PathPrefix
            value: /v1/completions
          headers:
            - name: model
              value: qwen257
              type: Exact
      backendRefs:
        - group: ""
          kind: Service
          name: qwen257
          namespace: default
          port: 8008